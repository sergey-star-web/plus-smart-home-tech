<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <title>Swagger UI - Smart Home API</title>
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/swagger-ui-dist/swagger-ui.css" />
</head>
<body>
<div id="swagger-ui"></div>
<script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist/swagger-ui-bundle.js"></script>
<script>
    const spec = {
        "openapi": "3.0.1",
        "info": {
        "title": "Smart Home Technologies API",
            "version": "1.0"
    },
        "servers": [
        {
            "url": "http://localhost:8080",
            "description": "Сервер для локальной разработки"
        }
    ],
        "tags": [
        {
            "name": "events",
            "description": "API для передачи событий от датчиков и хабов"
        }
    ],
        "paths": {
        "/events/sensors": {
            "post": {
                "tags": ["events"],
                    "summary": "Обработчик событий датчиков",
                    "description": "Эндпоинт для обработки событий от датчиков",
                    "operationId": "collectSensorEvent",
                    "requestBody": {
                    "description": "Данные события датчика (показания, изменение состояния и т.д)",
                        "content": {
                        "application/json": {
                            "schema": {
                                "oneOf": [
                                    { "$ref": "#/components/schemas/ClimateSensorEvent" },
                                    { "$ref": "#/components/schemas/LightSensorEvent" },
                                    { "$ref": "#/components/schemas/MotionSensorEvent" },
                                    { "$ref": "#/components/schemas/SwitchSensorEvent" },
                                    { "$ref": "#/components/schemas/TemperatureSensorEvent" }
                                ]
                            },
                            "examples": {
                                "LightSensorEvent": {
                                    "description": "Показания датчика освещённости",
                                        "value": {
                                        "id": "sensor.light.3",
                                            "hubId": "hub-2",
                                            "timestamp": "2024-08-06T16:54:03.129Z",
                                            "type": "LIGHT_SENSOR_EVENT",
                                            "linkQuality": 75,
                                            "luminosity": 59
                                    }
                                },
                                "SwitchSensorEvent": {
                                    "description": "Событие изменения состояния переключателя",
                                        "value": {
                                        "id": "sensor.switch.4356",
                                            "hubId": "hub-1",
                                            "timestamp": "2024-08-06T17:54:03.129Z",
                                            "type": "SWITCH_SENSOR_EVENT",
                                            "state": true
                                    }
                                }
                            }
                        }
                    },
                    "required": true
                },
                "responses": {
                    "200": {
                        "description": "OK"
                    }
                }
            }
        },
        "/events/hubs": {
            "post": {
                "tags": ["events"],
                    "summary": "Обработчик событий хабов",
                    "description": "Эндпоинт для обработки событий от хаба",
                    "operationId": "collectHubEvent",
                    "requestBody": {
                    "description": "Данные события хаба (регистрация/удаление устройств в хабе, добавление/удаление сценария умного дома)",
                        "content": {
                        "application/json": {
                            "schema": {
                                "oneOf": [
                                    { "$ref": "#/components/schemas/DeviceAddedEvent" },
                                    { "$ref": "#/components/schemas/DeviceRemovedEvent" },
                                    { "$ref": "#/components/schemas/ScenarioAddedEvent" },
                                    { "$ref": "#/components/schemas/ScenarioRemovedEvent" }
                                ]
                            },
                            "examples": {
                                "DeviceAddedEvent": {
                                    "description": "Событие регистрации нового датчика освещённости в хабе пользователя",
                                        "value": {
                                        "hubId": "hub.12345",
                                            "timestamp": "2024-08-06T15:11:24.157Z",
                                            "type": "DEVICE_ADDED",
                                            "id": "sensor.light.3",
                                            "deviceType": "MOTION_SENSOR"
                                    }
                                }
                            }
                        }
                    },
                    "required": true
                },
                "responses": {
                    "200": {
                        "description": "OK"
                    }
                }
            }
        }
    },
        "components": {
        "schemas": {
            "ClimateSensorEvent": {
                "required": ["co2Level", "hubId", "humidity", "id", "temperatureC", "type"],
                    "type": "object",
                    "properties": {
                    "id": { "type": "string", "description": "Идентификатор события." },
                    "hubId": { "type": "string", "description": "Идентификатор хаба, связанного с событием." },
                    "timestamp": { "type": "string", "description": "Временная метка события.", "format": "date-time" },
                    "temperatureC": { "type": "integer", "description": "Уровень температуры по шкале Цельсия.", "format": "int32" },
                    "humidity": { "type": "integer", "description": "Влажность.", "format": "int32" },
                    "co2Level": { "type": "integer", "description": "Уровень CO2.", "format": "int32" },
                    "type": { "type": "string", "description": "Тип события", "enum": ["MOTION_SENSOR_EVENT","TEMPERATURE_SENSOR_EVENT","LIGHT_SENSOR_EVENT","CLIMATE_SENSOR_EVENT","SWITCH_SENSOR_EVENT"] }
                }
            },
            "LightSensorEvent": {
                "required": ["hubId", "id", "type"],
                    "type": "object",
                    "properties": {
                    "id": { "type": "string", "description": "Идентификатор события." },
                    "hubId": { "type": "string", "description": "Идентификатор хаба." },
                    "timestamp": { "type": "string", "description": "Временная метка.", "format": "date-time" },
                    "linkQuality": { "type": "integer", "description": "Качество связи.", "format": "int32" },
                    "luminosity": { "type": "integer", "description": "Уровень освещённости.", "format": "int32" },
                    "type": { "type": "string", "description": "Тип события", "enum": ["MOTION_SENSOR_EVENT","TEMPERATURE_SENSOR_EVENT","LIGHT_SENSOR_EVENT","CLIMATE_SENSOR_EVENT","SWITCH_SENSOR_EVENT"] }
                }
            },
            "MotionSensorEvent": {
                "required": ["hubId", "id", "linkQuality", "motion", "type", "voltage"],
                    "type": "object",
                    "properties": {
                    "id": { "type": "string", "description": "Идентификатор события." },
                    "hubId": { "type": "string", "description": "Идентификатор хаба." },
                    "timestamp": { "type": "string", "description": "Временная метка.", "format": "date-time" },
                    "linkQuality": { "type": "integer", "description": "Качество связи.", "format": "int32" },
                    "motion": { "type": "boolean", "description": "Наличие движения." },
                    "voltage": { "type": "integer", "description": "Напряжение.", "format": "int32" },
                    "type": { "type": "string", "description": "Тип события", "enum": ["MOTION_SENSOR_EVENT", "TEMPERATURE_SENSOR_EVENT", "LIGHT_SENSOR_EVENT", "CLIMATE_SENSOR_EVENT", "SWITCH_SENSOR_EVENT"] }
                }
            },
            "SwitchSensorEvent": {
                "required": ["hubId", "id", "state", "type"],
                    "type": "object",
                    "properties": {
                    "id": { "type": "string", "description": "Идентификатор события." },
                    "hubId": { "type": "string", "description": "Идентификатор хаба." },
                    "timestamp": { "type": "string", "description": "Временная метка.", "format": "date-time" },
                    "state": { "type": "boolean", "description": "Текущее состояние переключателя." },
                    "type": { "type": "string", "description": "Тип события", "enum": ["MOTION_SENSOR_EVENT", "TEMPERATURE_SENSOR_EVENT", "LIGHT_SENSOR_EVENT", "CLIMATE_SENSOR_EVENT", "SWITCH_SENSOR_EVENT"] }
                }
            },
            "TemperatureSensorEvent": {
                "required": ["hubId", "id", "temperatureC", "type"],
                    "type": "object",
                    "properties": {
                    "id": { "type": "string", "description": "Идентификатор события." },
                    "hubId": { "type": "string", "description": "Идентификатор хаба." },
                    "timestamp": { "type": "string", "description": "Временная метка.", "format": "date-time" },
                    "temperatureC": { "type": "integer", "description": "Уровень температуры по шкале Цельсия.", "format": "int32" },
                    "type": { "type": "string", "description": "Тип события", "enum": ["MOTION_SENSOR_EVENT","TEMPERATURE_SENSOR_EVENT","LIGHT_SENSOR_EVENT","CLIMATE_SENSOR_EVENT","SWITCH_SENSOR_EVENT"] }
                }
            },
            "DeviceAddedEvent": {
                "required": ["hubId", "timestamp", "type", "id", "deviceType"],
                    "type": "object",
                    "properties": {
                    "hubId": { "type": "string" },
                    "timestamp": { "type": "string", "format": "date-time" },
                    "type": { "type": "string", "enum": ["DEVICE_ADDED"] } },
                "id": { "type": "string" },
                "deviceType": { "type": "string" }
            }
        },
        "DeviceRemovedEvent": {
            "required": ["hubId", "timestamp", "type", "id"],
                "type": "object",
                "properties": {
                "hubId": { "type": "string" },
                "timestamp": { "type": "string", "format": "date-time" },
                "type": { "type": "string", "enum": ["DEVICE_REMOVED"] } },
            "id": { "type": "string" }
        }
    },
        "ScenarioAddedEvent": {
        "required": ["hubId", "timestamp", "id", "name", "scene"],
            "type": "object",
            "properties": {
            "hubId": { "type": "string" },
            "timestamp": { "type": "string", "format": "date-time" },
            "id": { "type": "string" },
            "name": { "type": "string" },
            "scene": { "type": "object" } // Здесь можно более подробно определить структуру сцены
        }
    },
        "ScenarioRemovedEvent": {
            "required": ["hubId", "timestamp", "id"],
            "type": "object",
            "properties": {
                "hubId": {"type": "string"},
                "timestamp": {"type": "string", "format": "date-time"},
                "id": {"type": "string"}
            }
        }
    };

    const ui = SwaggerUIBundle({
        spec: spec,
        dom_id: '#swagger-ui'
    });
</script>
</body>
</html>
